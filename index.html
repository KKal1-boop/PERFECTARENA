<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- A phone is the game's own page: no separate build, no app wrapper. These three
       make iOS treat it as one (a standalone window when added to the home screen, the
       dark chrome the game's own palette asks for, and no Safari zoom on a control). -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PERFECTARENA" />
  <meta name="theme-color" content="#0b0b09" />
  <meta name="format-detection" content="telephone=no" />
  <title>PERFECTARENA</title>
  <link rel="icon" href="data:," />
  <style>
    html, body {
      margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden;
      overscroll-behavior: none;
      /* iOS: no rubber-band, no long-press magnifier, no text swelling, no blue tap flash. */
      -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
    }
    /* ── THE WHOLE WINDOW IS THE VIEW ────────────────────────────────────────
       The original drew into a 320×200 VGA screen: the 3D view was the top **147**
       lines and its status bar (`P1.IMG`, 320×53) the bottom 53. That 147 is not a
       guess — every frame of the install's six weapon sheets puts its own
       `yOffset + height` exactly there, because the weapon is pinned to the bottom of
       the *view* (`game/weaponView.js`) — and the port keeps the line.

       What it does **not** keep is the black band. The first version cut the canvas
       off at that line (`height: 73.5vh`) and left the bottom quarter of the window as
       bare page background — a black strip under the world, with the HUD text in it,
       which is the reported "a black band where the GUI is covers almost half the
       screen". The view now fills the window and the status band is an **overlay** on
       it: the weapon still stands on the 147-line, the HUD still sits below it, and the
       world carries on behind both. */
    #c {
      display: block; width: 100vw; height: 100vh;
      /* `100dvh` is the view that is actually visible while Safari's bars are out; the
         `100vh` line above is the fallback for a browser that does not know it. */
      height: 100dvh;
      touch-action: none; -webkit-user-select: none; user-select: none;
    }
    /* ══ THE INTERFACE ═════════════════════════════════════════════════════
       The owner, 2026-10-22: *"THE COLOR OF THE GUI YOU USED SOMETIME[S] MAKE TEXT NON
       VISIBLE AND THE GUI IS NEEDLESLY GIGANTIC FOR NOTHING — MINIMAL AND AESTHETIC WHILE
       KEEPING SOME OG ARENA ELEMENTS"*.

       So the interface is one material, and it is **night stone with a gold rule**: a near
       black slab that the install's own parchment texture is breathed into (PARCH.IMG under
       a 93% ink wash), a 2 px gold edge on the side a page opens from, small-caps gold
       headings, cream body text. Every colour below is *light on dark* or *gold on dark* —
       the old `#8a5a00` level line and the `#2f5e34` guard line were dark ink on a dark
       panel, which is exactly the "text non visible" the owner saw.

       And it is **small**. The 1994 status bar is 53 px of a 200-line screen; on a 1080p
       window the old rules stretched `P1.IMG` to 186 px and hung a 64 px hotbar over it. The
       bar is now 44 px (50 on a phone), the hotbar cells are 30–38 px, the message panel is
       430 px wide, and every page is 340–480 px with 11.5–12.5 px type. Arena's pictures
       still do the talking — the compass rose, the command strip's buttons, the coin mark,
       the parchment, the portrait — they are just trim on a compact frame instead of
       wallpaper stretched over a quarter of the screen. */
    :root {
      --ar-ink: #ece0c0;
      --ar-ink-soft: #b3a276;
      --ar-gold: #d8b04a;
      --ar-gold-lit: #f8d97a;
      --ar-red: #e08a72;
      --ar-page: #0b0b09;
      --ar-page-edge: #5f5026;
      --ar-rule: #6d5a1e;
      --ar-stone: none;
      --ar-stone-w: 120px;
      --ar-stone-h: 48px;
      --ar-band: none;
      --ar-band-bottom: none;
      --ar-face: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
      --ar-ui: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --ar-status: none;
      --ar-command: none;
      --ar-frame: none;
      --ar-parchment: none;
      --ar-compass: none;
      --ar-gold-mark: none;
      --ar-key-mark: none;
    }

    /* ── THE VITALS (src/scenes/interior.js, `renderStatusBar`) ──────────────
       The owner, 2026-10-22: *"REMOVE THE BAR UNDER EVERYTHING … USE A METHOD SIMILAR TO
       DAGGERFALL ENHANCED TO SHOW HEALTH STAMINA AND MAGICKA"*. There is no bar across the
       window: three slim wells float in the bottom-left corner (health red, stamina green,
       magicka blue), with the quest marker, the purse and the level on the same small plate
       of the stone every page is cut from. It takes no click. */
    #statusbar {
      position: fixed; left: 12px; bottom: 12px; z-index: 5;
      width: 228px; box-sizing: border-box;
      display: flex; flex-direction: column; gap: 7px; padding: 9px 11px 8px;
      background-color: #0a0a07;
      background-image: linear-gradient(#14130ee8, #08080af2), var(--ar-stone);
      background-size: cover, var(--ar-stone-w) var(--ar-stone-h);
      background-repeat: no-repeat, repeat;
      border: 1px solid #5f5026; border-left: 2px solid var(--ar-gold);
      border-radius: 2px;
      box-shadow: inset 0 0 0 1px #0008, 0 8px 24px #0009;
      font: 11px/1.2 var(--ar-ui); color: var(--ar-ink);
      pointer-events: none;
    }
    #statusbar .sb-health, #statusbar .sb-stamina, #statusbar .sb-spell {
      position: relative; display: grid; grid-template-columns: 1fr auto;
      align-items: baseline; gap: 2px 6px; white-space: nowrap;
    }
    #statusbar .sb-health span, #statusbar .sb-stamina span, #statusbar .sb-spell span {
      font-size: 8px; letter-spacing: 0.16em; text-transform: uppercase; color: #a2946e;
    }
    #statusbar .sb-health b, #statusbar .sb-stamina b, #statusbar .sb-spell b {
      color: #f2e5c9; font-size: 10.5px; letter-spacing: 0.02em; font-weight: 600;
      text-align: right;
    }
    /* The channel, then the fill the scene writes a width on. */
    #statusbar .sb-health i, #statusbar .sb-stamina i, #statusbar .sb-spell i {
      grid-column: 1 / -1; display: block; height: 5px; width: 100%; margin-top: 2px;
      border-radius: 1px; box-shadow: inset 0 0 0 1px #000000aa, 0 0 8px #00000066;
    }
    #statusbar .sb-health i { background: linear-gradient(#e0563f, #7c1d12); }
    #statusbar .sb-stamina i { background: linear-gradient(#6fae6a, #2f5e34); }
    #statusbar .sb-spell i { background: linear-gradient(#5fa0d0, #1d3f5e); }
    /* The purse: the install's coin mark, the count, the level, the keys. */
    #statusbar .sb-purse {
      display: flex; align-items: center; gap: 8px; margin-top: 1px; padding-top: 6px;
      border-top: 1px solid #c8a54a2e;
      font-size: 9.5px; letter-spacing: 0.05em; color: #a2946e; white-space: nowrap;
    }
    #statusbar .sb-purse .coin {
      width: 11px; height: 11px; border-radius: 50%; flex: none;
      background-color: #c8a54a; background-image: var(--ar-gold-mark);
      background-size: 100% 100%; image-rendering: pixelated;
      box-shadow: inset 0 0 0 1px #00000066, 0 0 6px #c8a54a44;
    }
    #statusbar .sb-purse b { color: var(--ar-gold-lit); font-size: 11.5px; font-weight: 600; }
    #statusbar .sb-purse #sb-level { color: #cfc2a4; margin-left: auto; }
    #statusbar .sb-purse .sb-keys { color: #8c8069; }
    /* **The quest marker, in the vitals plate** — the owner's own instruction: the line that
       says where to go belongs with the numbers a player watches, not in the room's notes. */
    #statusbar #hud-quest {
      white-space: pre-line; padding-top: 6px; border-top: 1px solid #c8a54a2e;
      font: 10.5px/1.45 var(--ar-face); color: #f0c979;
    }
    #statusbar #hud-quest:empty { display: none; }

    /* ── THE HOTBAR (src/game/hotbar.js) ────────────────────────────────────
       Ten small cells on the install's own command-strip buttons (`S2.IMG`), sitting on the
       status bar's top edge. A cell is its key, its button and its name — no more. */
    /* ── THE HOTBAR (src/game/hotbar.js) ────────────────────────────────────
       Ten cells for **the player's own things** — a potion, a scroll, a spell — cut into the
       same night stone as every window and trimmed with the install's gold. An empty cell is
       a slot with a dim plus; a pinned one carries a gold initial and its name. */
    #hotbar {
      position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 6;
      display: flex; gap: 3px; padding: 6px 7px 5px; box-sizing: content-box;
      background-color: #0a0a07;
      background-image: linear-gradient(#17140ef2, #0a0906f5), var(--ar-stone);
      background-size: cover, var(--ar-stone-w) var(--ar-stone-h);
      background-repeat: no-repeat, repeat;
      border: 1px solid #5f5026;
      box-shadow: 0 0 0 1px #0008, 0 8px 24px #000a, inset 0 1px 0 #c8a54a40;
      pointer-events: auto;
    }
    #hotbar .hb-cell {
      position: relative; width: clamp(32px, 3.2vw, 40px); height: clamp(34px, 3.4vw, 42px);
      padding: 0; margin: 0; box-sizing: border-box; cursor: pointer; font: inherit;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
      background: linear-gradient(#151209, #090806);
      border: 1px solid #4a3f22; border-radius: 2px; color: #e9ddc2;
      box-shadow: inset 0 1px 0 #c8a54a1f;
      overflow: hidden; -webkit-tap-highlight-color: transparent;
    }
    #hotbar .hb-cell .hb-key {
      position: absolute; left: 3px; top: 1px; z-index: 2;
      font: 600 8px/1.2 var(--ar-ui); color: #9c8a5e; text-shadow: 0 1px 2px #000;
    }
    #hotbar .hb-cell .hb-plus {
      position: absolute; inset: 0; display: grid; place-items: center; padding-bottom: 7px;
      font: 400 13px/1 var(--ar-ui); color: #7d6f4c;
    }
    #hotbar .hb-cell.empty:hover .hb-plus { color: #f4c94c; }
    #hotbar .hb-cell .hb-glyph {
      position: relative; z-index: 1; display: block; margin-top: 2px;
      font: 600 clamp(13px, 1.4vw, 17px)/1 var(--ar-face); color: #f4c94c;
      text-shadow: 0 0 8px #c8a54a66, 0 1px 2px #000;
    }
    #hotbar .hb-cell .hb-label {
      position: relative; z-index: 2; width: 100%; padding: 1px 2px; box-sizing: border-box;
      font: 600 8px/1.15 var(--ar-ui); text-align: center;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      color: #d8cbae; background: linear-gradient(#0000, #000000c4 55%);
    }
    #hotbar .hb-cell.pinned { border-color: #a8873a; background: linear-gradient(#1d1810, #0d0b07); }
    #hotbar .hb-cell.pinned .hb-label { color: var(--ar-gold-lit); background: linear-gradient(#0000, #2a1f08e6 55%); }
    #hotbar .hb-cell.unavailable { opacity: 0.4; }
    #hotbar .hb-cell:hover { border-color: var(--ar-gold); }
    #hotbar .hb-cell:active, #hotbar .hb-cell.on { border-color: #ffe9a8; box-shadow: inset 0 0 10px #ffe9a84d; }

    /* ── THE ONE PANEL (src/scenes/interior.js) ─────────────────────────────
       Where the player is, what is in front of them and what is in reach: one compact page
       above the hotbar, darkest stone with the parchment under it, cream text and gold for
       a noun the eye should catch. */
    #hud {
      position: fixed; left: 12px; top: 42px; z-index: 5;
      width: min(350px, 34vw); max-height: min(20vh, 168px);
      overflow-y: auto; overflow-x: hidden; padding: 8px 11px 9px; box-sizing: border-box;
      background-color: var(--ar-page);
      background-image: linear-gradient(#0d0f14ee, #0a0b0ff7), var(--ar-parchment);
      background-size: cover, 100% 100%; background-repeat: no-repeat;
      border: 1px solid var(--ar-page-edge); border-left: 2px solid var(--ar-gold);
      border-radius: 3px; box-shadow: 0 8px 26px #000a;
      font: 11.5px/1.5 var(--ar-face); color: var(--ar-ink);
      pointer-events: none; white-space: normal; overflow-wrap: anywhere;
      scrollbar-width: thin; scrollbar-color: #3d3628 transparent;
    }
    #hud b, #hud .v { color: var(--ar-gold-lit); font-weight: 600; }
    /* **The message panel folds.** The quest marker now lives in the vitals plate, so this page
       is only the room's own notes; the corner plate closes it to nothing and opens it again. */
    #hud .hud-toggle {
      position: absolute; right: 4px; top: 4px; z-index: 2; pointer-events: auto;
      width: 18px; height: 18px; padding: 0; display: grid; place-items: center;
      font: 600 12px/1 var(--ar-ui); color: #c8a54a; cursor: pointer;
      background: #12100a; border: 1px solid #4a3f22; border-radius: 2px;
    }
    #hud .hud-toggle:hover { color: #ffe9a8; border-color: #a8873a; }
    #hud.folded { width: auto; max-height: none; padding: 3px 6px; overflow: visible; }
    #hud.folded > div { display: none; }
    #hud .hint { color: #a99c81; font-size: 10.5px; font-style: italic; }
    #hud #hud-place .hint { display: block; }
    #hud .k { color: var(--ar-gold-lit); font-weight: 600; }
    /* Every state line is a *light* colour, because every line sits on night stone. */
    #hud .level, #hud .guard, #hud .stair, #hud .water, #hud .lava,
    #hud .ward, #hud .regen, #hud .light, #hud .hidden, #hud .held, #hud .afflicted { font-weight: 600; }
    #hud .level { color: #f0c979; }
    #hud .guard { color: #9ee0b0; }
    #hud .stair { color: #e8c86a; }
    #hud .water { color: #8fc4e8; }
    #hud .lava { color: #ffa878; }
    #hud .ward, #hud .light { color: #9cc6ff; }
    #hud .regen { color: #9ee0b0; }
    #hud .hidden { color: #c9b6e8; }
    #hud .held { color: #ff9e8a; }
    #hud .afflicted { color: #e8a8d0; }

    /* ── THE COMPASS (src/game/compass.js) ──────────────────────────────────
       The rose (`COMPASS.IMG`) and the bearing, in a pill small enough to forget. */
    #compass {
      position: fixed; left: 50%; top: 7px; transform: translateX(-50%); z-index: 5;
      display: flex; align-items: center; gap: 8px; pointer-events: none;
      padding: 3px 10px 3px 25px; box-sizing: border-box;
      background-color: #0b0d12d8;
      background-image: var(--ar-compass);
      background-size: 15px 8px; background-position: 7px center; background-repeat: no-repeat;
      border: 1px solid var(--ar-page-edge); border-radius: 3px;
      font: 10.5px/1.3 var(--ar-ui); color: #b7aa8b; letter-spacing: 0.08em;
      text-shadow: 0 1px 2px #000; white-space: nowrap;
    }
    #compass #compass-points span { display: inline-block; min-width: 16px; text-align: center; }
    #compass #compass-points span.at { color: var(--ar-gold-lit); }
    #compass #compass-face { color: var(--ar-gold); font-weight: 600; }

    /* ── the weapon in the player's hands (src/scenes/interior.js) ──────────
       Arena's own first-person weapon art: a `.CIF` whose frames are the swing. It is a 2D
       layer over the world, under the interface, and it never takes a click. */
    #weapon { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; z-index: 3; pointer-events: none; }

    /* ── what a place says when you arrive (src/scenes/interior.js) ──────────
       Arena's own prose: `citytxt`'s gate greeting for a city-state, or
       `dungeon.txt`'s arrival text for a quest dungeon. */
    #arrival {
      position: fixed; left: 50%; top: 8vh; transform: translateX(-50%); z-index: 4;
      width: min(560px, 86vw); display: none; padding: 16px 20px 14px;
      background: #0d1018ee; border: 1px solid #4a4436; border-left: 3px solid #8a7440;
      color: #e8e0c8; font: 13px/1.65 ui-monospace, Menlo, Consolas, monospace;
      box-shadow: 0 10px 40px #000b; pointer-events: none;
    }
    #arrival.on { display: block; }
    #arrival h2 { margin: 0 0 8px; font-size: 15px; color: #f2d9a0; letter-spacing: 0.04em; }
    #arrival p { margin: 0 0 4px; }
    #arrival .src { margin-top: 8px; color: #7d7761; font-size: 11px; }
    #notice {
      position: fixed; left: 50%; bottom: 12vh; transform: translateX(-50%); z-index: 4;
      max-width: min(560px, 86vw); display: none; padding: 9px 14px; white-space: pre-wrap;
      background: #0d1018ee; border: 1px solid #6f9e78; color: #d8f0dc;
      font: 12px/1.6 ui-monospace, Menlo, Consolas, monospace; text-align: center;
    }
    #notice.on { display: block; }
    /* ── character creation (src/scenes/chargen.js) ─────────────────────────
       Arena's own `CHARSPEL.IMG` screen as the backdrop, scaled to fit. */
    #chargen {
      position: fixed; inset: 0; z-index: 9; display: none; overflow: auto;
      background: #05060a; color: #e8e0c8;
      font: 13px/1.6 ui-monospace, Menlo, Consolas, monospace;
    }
    #chargen.on { display: block; }
    #chargen-art {
      position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover;
      image-rendering: pixelated; opacity: 0.35; display: none; pointer-events: none;
    }
    #chargen-panel {
      position: relative; margin: 0 auto; padding: 26px 22px 40px; max-width: 660px;
      min-height: 100vh; background: #080a10f2; box-sizing: border-box;
    }
    #chargen-panel h1 { margin: 0 0 10px; font-size: 19px; color: #f2d9a0; letter-spacing: 0.03em; }
    #chargen-panel .lead { margin: 0 0 10px; color: #cfc8b0; }
    #chargen-panel .sub { margin: 8px 0; color: #8d8770; font-size: 12px; }
    #chargen-panel .warn { margin: 8px 0; color: #e8a08a; }
    #chargen-panel .steps { margin: 0 0 6px; color: #9fd8a8; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
    #chargen-panel .prose p { margin: 0 0 3px; white-space: pre-wrap; }
    #chargen-panel .answers { margin: 14px 0 6px; display: grid; gap: 8px; }
    #chargen-panel button {
      display: block; width: 100%; text-align: left; font: inherit; padding: 9px 12px; cursor: pointer;
      background: #161a24; color: #e8e0c8; border: 1px solid #3b4358; border-left: 3px solid #5d6b8e;
    }
    #chargen-panel button:hover { background: #1e2432; border-left-color: #9fd8a8; }
    #chargen-panel button .key { color: #ffe9a8; margin-right: 6px; }
    #chargen-panel button .tag { color: #8d8770; float: right; margin-left: 10px; }
    #chargen-panel button.ghost { border-left-color: #4a4436; color: #a9a48d; }
    #chargen-panel button.class-choice .name { display: block; color: #ffe9a8; }
    #chargen-panel button.class-choice .stat { display: block; color: #8d8770; font-size: 11px; }
    #chargen-panel button.class-choice .abil { display: block; color: #a9a48d; font-size: 11px; }
    #chargen-panel button.class-choice.on { background: #1d2a22; border-left-color: #6f9e78; }
    #chargen-panel .field { display: block; margin: 10px 0; color: #cfc8b0; }
    #chargen-panel input, #chargen-panel select {
      display: block; width: 100%; margin-top: 5px; padding: 7px 9px; box-sizing: border-box;
      font: inherit; background: #10131c; color: #e8e0c8; border: 1px solid #3b4358;
    }
    #chargen-panel table.attrs { width: 100%; border-collapse: collapse; margin: 12px 0; }
    #chargen-panel table.attrs th { text-align: left; padding: 5px 6px; color: #ffe9a8; width: 44px; }
    #chargen-panel table.attrs td { padding: 5px 6px; border-top: 1px solid #22262f; }
    #chargen-panel table.attrs .val { color: #9fd8a8; text-align: right; width: 42px; }
    #chargen-panel table.attrs .bonus { color: #8d8770; font-size: 11px; }
    #chargen-panel table.attrs .spend { text-align: right; width: 108px; }
    #chargen-panel table.attrs .spend button {
      display: inline-block; width: auto; padding: 1px 8px; background: #1b1d24; border-left-width: 1px;
    }
    #chargen-panel table.attrs .spend span { display: inline-block; min-width: 20px; text-align: center; color: #ffe9a8; }
    /* The visual creator: every walkable body, and a live 360 stage beside them. */
    #chargen-panel .look { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 14px; align-items: start; margin: 10px 0 6px; }
    #chargen-panel .look-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 7px; max-height: 430px; overflow: auto; padding-right: 3px; }
    #chargen-panel .look-choice { display: block; padding: 5px; text-align: center; border-left-width: 1px; }
    #chargen-panel .look-choice canvas { display: block; margin: 0 auto; background: #0a0c12; image-rendering: pixelated; width: 64px; height: 78px; }
    #chargen-panel .look-choice .name { display: block; color: #cfc8b0; font-size: 10px; line-height: 1.25; margin-top: 3px; }
    #chargen-panel .look-choice .tag { display: block; color: #8d8770; font-size: 9px; }
    #chargen-panel .look-choice.on { background: #1d2a22; border-left: 3px solid #9fd8a8; }
    #chargen-panel .look-stage { background: #0a0c12; border: 1px solid #3b4358; padding: 8px; text-align: center; }
    #chargen-panel #cg-look { display: block; width: 100%; height: auto; image-rendering: pixelated; background: #0a0c12; }
    #chargen-panel .look-note { color: #8d8770; font-size: 10px; line-height: 1.35; margin: 6px 0; }
    #chargen-panel .look-controls { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
    #chargen-panel .look-controls button { display: inline-block; width: auto; padding: 4px 7px; font-size: 11px; border-left-width: 1px; }
    #chargen-panel .look-controls button.on { background: #1d2a22; border-color: #9fd8a8; }
    #chargen-panel .look-colours { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 6px 0 10px; }
    #chargen-panel .look-colours:has(> :only-child) { grid-template-columns: 1fr; }
    #chargen-panel .look-colour > .label { display: block; color: #cfc8b0; font-size: 11px; margin-bottom: 4px; }
    #chargen-panel .look-colour .swatches { display: flex; flex-wrap: wrap; gap: 5px; }
    #chargen-panel .look-swatch { display: flex; align-items: center; gap: 4px; width: auto; padding: 3px 6px 3px 3px; background: #12151d; border-left-width: 1px; font-size: 10px; color: #8d8770; }
    #chargen-panel .look-swatch .dot { display: block; width: 16px; height: 16px; border: 1px solid #000; flex: none; }
    #chargen-panel .look-swatch .dot.arena { background: repeating-linear-gradient(45deg, #3b4358 0 3px, #0a0c12 3px 6px); }
    #chargen-panel .look-swatch .name { text-transform: capitalize; }
    #chargen-panel .look-swatch.on { background: #1d2a22; border-left: 3px solid #9fd8a8; color: #e8e0c8; }
    @media (max-width: 620px) {
      #chargen-panel .look { grid-template-columns: 1fr; }
      #chargen-panel .look-colours { grid-template-columns: 1fr; }
    }
    #boot { position: fixed; inset: 0; display: grid; place-items: center; color: #d8b45a;
            font: 14px/1.6 ui-monospace, monospace; text-align: center; background: #06070a; z-index: 6; }
    #boot.hidden { display: none; }
    #boot button { font: inherit; padding: 8px 14px; margin-top: 12px; background: #1b1d24; color: #e8e0c8;
                   border: 1px solid #4a4436; cursor: pointer; }
    /* ── the world map (src/scenes/worldmap.js) ──────────────────────────────
       A DOM layer over the game canvas: Arena's own TAMRIEL.IMG art, province
       borders from CITYDATA.64, and a marker per location. */
    #map { position: fixed; inset: 0; z-index: 7; display: none; background: #0b1626; }
    #map.on { display: block; }
    #map-canvas { position: absolute; inset: 0; touch-action: none; }
    #map-tools { position: absolute; left: 12px; top: 78px; width: 225px; max-height: calc(100vh - 250px); overflow: auto;
      padding: 10px; background: #080a10e8; border: 1px solid #4a4436; color: #e8e0c8; font: 11px/1.5 ui-monospace, monospace; }
    #map-tools label { display: block; margin: 4px 0; }
    #map-tools select, #map-search, #map-tools button { box-sizing: border-box; font: inherit;
      color: #e8e0c8; background: #1b1d24; border: 1px solid #4a4436; padding: 4px; }
    #map-tools select, #map-search { width: 100%; }
    #map-tools button { cursor: pointer; }
    #map-tools .map-nav { display: flex; gap: 5px; margin: 5px 0; }
    #map-results { max-height: 145px; overflow: auto; margin: 5px 0; }
    #map-results button { display: block; width: 100%; text-align: left; margin: 3px 0; }
    #map-readout { white-space: pre-line; color: #ffe9a8; margin: 8px 0; }
    #map-tools small { color: #aaa48e; }
    @media (max-width: 820px) { #map-tools { width: 185px; top: 90px; max-height: 45vh; } }
    #map-bar {
      position: absolute; left: 0; right: 0; top: 0; padding: 9px 12px; display: flex; gap: 14px;
      flex-wrap: wrap; row-gap: 2px;
      align-items: baseline; background: linear-gradient(#080a10ee, #080a10bb 70%, #080a1000);
      font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; color: #e8e0c8; pointer-events: none;
    }
    #map-bar .obj { color: #ffe9a8; }
    #map-bar .side { color: #9fd8a8; }
    #map-bar .pieces { color: #d8b45a; }
    #map-bar .hint { margin-left: auto; color: #8d8770; }
    /* The player's own sheet, bottom-right, so the map can say who is travelling. */
    /* **The character sheet never sits on the travel button.** It used to share the bottom
       right corner with the travel card, so a selected place's Travel button was under it.
       The sheet now hangs from the top right, beneath the journal, and the card keeps the
       corner to itself. */
    #map-sheet {
      position: absolute; right: 12px; top: 120px; bottom: auto; display: none; max-width: 260px; padding: 9px 11px;
      background: #080a10e6; border: 1px solid #3b4358; border-left: 3px solid #c8a54a;
      font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; color: #e8e0c8; pointer-events: none;
    }
    #map-sheet.on { display: block; }
    #map-sheet b { color: #ffe9a8; }
    #map-sheet .sub { color: #8d8770; }
    #map-sheet .hp { color: #9fd8a8; }
    #map-sheet .sp { color: #8fb8e8; }
    #map-sheet .gold { color: #e8c86a; }
    #map-sheet .warn { color: #e8c0b4; }
    /* The sheet is a *view* over the map, so clicks pass through it to the markers behind
       it (`pointer-events: none`) — its own buttons are the one exception, and they have
       to say so, or the new-game door here is a button nobody can press. */
    #map-sheet button {
      pointer-events: auto; font: inherit; margin: 7px 6px 0 0; padding: 5px 10px; cursor: pointer;
      background: #232833; color: #e8e0c8; border: 1px solid #4a4436; border-left: 3px solid #5d6b8e;
    }
    #map-sheet button:hover { background: #2c3240; color: #ffe9a8; border-left-color: #9fd8a8; }
    #map-sheet button.danger { border-left-color: #8c3a2e; }
    #map-sheet button.danger:hover { background: #2a1a18; color: #ffb4a8; border-left-color: #e2564a; }
    /* ── the side work (src/game/radiantQuests.js, shown by the world map) ─── */
    #map-board {
      position: absolute; left: 14px; top: 52px; width: 330px; max-height: 68vh; overflow: auto;
      display: none; padding: 12px 14px; background: #10131cf2; border: 1px solid #4a4436; border-radius: 3px;
      font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; color: #e8e0c8; box-shadow: 0 6px 24px #000a;
      /* **Above the map tools.** `#map-tools` is created after this panel and sits in the same
         left column, so without a stacking order of its own the board's Accept buttons were
         under another panel's transparent boxes and a real click landed on the tools. */
      z-index: 3;
    }
    #map-board.on { display: block; }
    #map-board h2 { margin: 0 0 6px; font-size: 13px; color: #f2d9a0; letter-spacing: 0.02em; }
    #map-board ul { list-style: none; margin: 0; padding: 0; }
    #map-board li { margin: 0 0 10px; padding: 8px 9px; background: #171b26; border-left: 2px solid #5d6b8e; }
    #map-board li h3 { margin: 0 0 3px; font-size: 12px; color: #ffe9a8; }
    #map-board .sub { margin: 2px 0; color: #a9a48d; }
    #map-board code { color: #ffe9a8; }
    #map-board .src { color: #9fd8a8; }
    #map-board .active { margin: 2px 0 8px; padding: 8px 9px; background: #14201a; border-left: 2px solid #6f9e78; }
    #map-board .hint { margin: 6px 0 0; color: #8d8770; }
    #map-board button {
      font: inherit; margin-top: 6px; padding: 4px 10px; background: #26304a; color: #e8e0c8;
      border: 1px solid #5d6b8e; cursor: pointer;
    }
    #map-board button:hover { background: #33405f; }
    /* The journal sits under the bar on the right, NOT on the bottom edge: the
       character sheet is bottom-right too, and the two used to draw over each other
       (seen in the first overlay build). */
    #map-journal {
      position: absolute; right: 14px; top: 44px; max-width: 300px; padding: 7px 10px;
      background: #080a10cc; border: 1px solid #33302a; color: #c9c3ab;
      font: 11px/1.6 ui-monospace, monospace; pointer-events: none; text-align: right;
    }
    #map-journal b { color: #f2d9a0; }
    /* A narrow window is a real window: the legend is the first thing to go, and
       the panels stop being a third of the screen each. */
    @media (max-width: 820px) {
      #map-legend { display: none; }
      #map-bar { font-size: 11px; gap: 8px; }
      #map-board { width: min(330px, calc(100vw - 24px)); max-height: 40vh; }
      #map-card { width: min(300px, calc(100vw - 24px)); }
      /* Right side: journal under the bar, sheet at the bottom, card between them.
         Left side: the board, with the legend (the usual bottom-left tenant) hidden. */
      #map-journal { max-width: min(300px, calc(100vw - 24px)); top: 60px; bottom: auto; }
      #map-sheet { max-width: min(260px, calc(100vw - 24px)); }
    }
    #map-card {
      position: absolute; right: 14px; bottom: 78px; width: 300px; display: none; padding: 12px 14px;
      background: #10131ce8; border: 1px solid #4a4436; border-radius: 3px;
      font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; color: #e8e0c8; box-shadow: 0 6px 24px #000a;
    }
    #map-card.on { display: block; }
    #map-card h2 { margin: 0 0 4px; font-size: 15px; color: #f2d9a0; letter-spacing: 0.02em; }
    #map-card .sub { margin: 2px 0; color: #a9a48d; }
    #map-card code { color: #ffe9a8; }
    #map-card button {
      font: inherit; margin-top: 8px; padding: 6px 12px; background: #26304a; color: #e8e0c8;
      border: 1px solid #5d6b8e; cursor: pointer;
    }
    #map-card button.ghost { margin-left: 6px; background: #1b1d24; border-color: #4a4436; }
    #map-card button:hover { background: #33405f; }
    #map-hover {
      position: absolute; display: none; padding: 3px 7px; background: #080a10e0; border: 1px solid #4a4436;
      color: #ffe9a8; font: 11px/1.4 ui-monospace, monospace; pointer-events: none; white-space: nowrap;
    }
    #map-hover.on { display: block; }
    #map-legend {
      position: absolute; left: 12px; bottom: 12px; padding: 8px 10px; background: #080a10cc;
      border: 1px solid #33302a; color: #c9c3ab; font: 11px/1.7 ui-monospace, monospace; pointer-events: none;
    }
    #map-legend b { color: #f2d9a0; }
    #map-legend .k { color: #f2d9a0; } #map-legend .d { color: #8c8676; }
    #map-legend .s { color: #e2564a; } #map-legend .p { color: #f6f2df; }
    @media (max-width: 700px) {
      #hud {
        left: 8px; right: 8px; width: auto; max-width: none;
        max-height: 42vh; overflow: auto; pointer-events: auto; font-size: 11px;
      }
      #hud .hint { display: none; }
      #arrival { width: 90vw; box-sizing: border-box; font-size: 12px; }
    }
    /* ── the start menu (src/scenes/startMenu.js) ───────────────────────────
       Arena's title screen: the install's own TITLE.IMG behind a small panel with the two
       choices a save can honour — continue the character you have, or begin again. It is
       the screen a plain launch opens on, before creation and before the world. */
    #startmenu {
      position: fixed; inset: 0; z-index: 60; display: none; place-items: end center;
      padding-bottom: 4vh; box-sizing: border-box;
      background: #05060a; color: #e8e0c8;
      font: 13px/1.6 ui-monospace, Menlo, Consolas, monospace;
    }
    #startmenu.on { display: grid; }
    #startmenu #startmenu-art {
      position: absolute; inset: 0; width: 100%; height: 100%;
      /* **Letterboxed, not cropped.** `TITLE.IMG` is Arena's 320×200 screen; `cover` on a
         portrait window cut the logo in half. The whole picture is shown at its own scale. */
      object-fit: contain; object-position: top center; image-rendering: pixelated; opacity: 0;
      filter: saturate(0.9) brightness(0.72); pointer-events: none;
    }
    #startmenu.art #startmenu-art { opacity: 1; }
    #startmenu .panel {
      position: relative; width: min(520px, calc(100vw - 32px));
      padding: 24px 26px 20px; box-sizing: border-box;
      background: #0b0d14e6; border: 1px solid #4a4436; border-left: 3px solid #c8a54a;
      box-shadow: 0 20px 80px #000c;
    }
    #startmenu .kicker { margin: 0; color: #8d8770; letter-spacing: 0.26em; text-transform: uppercase; font-size: 10px; }
    #startmenu h1 { margin: 2px 0 4px; font-size: 40px; line-height: 1.05; letter-spacing: 0.28em; color: #f2d9a0; font-weight: 600; }
    #startmenu .sub { margin: 0 0 18px; color: #a9a48d; }
    #startmenu .rows { display: grid; gap: 8px; }
    #startmenu button {
      font: inherit; text-align: left; padding: 10px 12px; cursor: pointer;
      background: #161a24; color: #e8e0c8; border: 1px solid #3b4358; border-left: 3px solid #5d6b8e;
    }
    #startmenu button:hover:not(:disabled), #startmenu button.on:not(:disabled) {
      background: #1e2432; border-left-color: #9fd8a8; color: #ffe9a8;
    }
    #startmenu button:disabled { color: #6f6a58; cursor: default; background: #10121a; border-left-color: #3b3226; }
    #startmenu button .key { color: #ffe9a8; margin-right: 9px; }
    #startmenu button:disabled .key { color: #6f6a58; }
    #startmenu button .tag { color: #8d8770; float: right; margin-left: 12px; font-size: 11px; }
    #startmenu .hint { margin: 12px 0 0; color: #8d8770; font-size: 11px; }
    #startmenu .folder { margin: 10px 0 0; color: #6f6a58; font-size: 10px; overflow-wrap: anywhere; }

    /* ── the ending (src/scenes/interior.js) ────────────────────────────────
       Arena's closing scene, in its own words: the Emperor's, and then the record of
       what the player actually did. It is a page, not a banner — it takes the screen.
       The closing *movie* (`END01.FLC`) now plays before this page does, through the
       install's own FLIC art (`src/scenes/cutscenePlayer.js`). */
    #ending {
      position: fixed; inset: 0; z-index: 40; display: none; overflow: auto;
      padding: 8vh 6vw; box-sizing: border-box;
      background: radial-gradient(ellipse at 50% 0%, #2a1c14f2, #05060af7 70%);
      font: 14px/1.7 ui-monospace, Menlo, Consolas, monospace; color: #e8e0c8; text-align: center;
    }
    #ending.on { display: block; }
    #ending h2 {
      margin: 0 0 18px; font-size: 30px; letter-spacing: 0.16em; text-transform: uppercase;
      color: #f4d98a; text-shadow: 0 0 26px #f4d98a55;
    }
    #ending p.quote { margin: 0 auto 16px; max-width: 62ch; color: #efe7d2; font-style: italic; }
    #ending .record {
      margin: 26px auto 18px; max-width: 56ch; padding: 14px 18px;
      border-top: 1px solid #6d5a1e; border-bottom: 1px solid #6d5a1e; color: #c9c3ab;
    }
    #ending .record p { margin: 3px 0; }
    #ending .record b { color: #ffe9a8; }
    #ending .src { color: #8d8770; font-size: 11px; font-style: normal; }
    #ending .hint { color: #8d8770; font-size: 11px; }
    /* ── the install's own movies (src/scenes/cutscenePlayer.js) ─────────────
       A `.FLC` is 320×200 art from 1994. It is drawn at a whole-number scale with
       smoothing off, because a palette of 256 hand-inked colours is destroyed by
       fractional scaling — and the movie is the one thing on screen, so the page
       behind it goes black. */
    #cutscene {
      position: fixed; inset: 0; z-index: 50; display: none;
      background: #000; align-items: center; justify-content: center; flex-direction: column;
    }
    #cutscene.on { display: flex; }
    #cutscene-sheet { image-rendering: pixelated; background: #000; }
    #cutscene-caption {
      margin-top: 10px; color: #6f6a58; font: 11px/1.5 ui-monospace, Menlo, Consolas, monospace;
      letter-spacing: 0.06em;
    }
    /* ── what the player carries (src/game/inventory.js) ─────────────────────
       Weapon and material, the purse, the quest's items and the tally. Only what the
       project can stand behind — the item chunks in `.MIF`/`A.EXE` are not decoded. */
    #inventory {
      position: fixed; right: 14px; top: 14px; z-index: 30; display: none;
      width: min(380px, calc(100vw - 28px)); max-height: 78vh; overflow: auto;
      padding: 12px 15px; box-sizing: border-box;
      background: #10131cf2; border: 1px solid #4a4436; border-left: 3px solid #c8a54a;
      font: 12px/1.6 ui-monospace, Menlo, Consolas, monospace; color: #e8e0c8;
      box-shadow: 0 6px 24px #000a;
    }
    #inventory.on { display: block; }
    #inventory.portrait-mode {
      left: 50%; right: auto; top: 14px; transform: translateX(-50%);
      width: min(920px, calc(100vw - 28px)); max-height: calc(100dvh - 28px);
      text-align: center;
    }
    #character-portrait {
      display: block; width: min(100%, 51.68dvh, 577.6px); height: auto;
      aspect-ratio: 152 / 200; margin: 12px auto;
    }
    #inventory h2 { margin: 0 0 8px; font-size: 13px; color: #f2d9a0; letter-spacing: 0.02em; }
    #inventory h3 { margin: 10px 0 4px; font-size: 11px; color: #c8a54a; letter-spacing: 0.08em; text-transform: uppercase; }
    #inventory ul { list-style: none; margin: 0; padding: 0; }
    #inventory li { padding: 3px 0; border-bottom: 1px solid #1d212c; }
    #inventory b { color: #efe7d2; }
    #inventory .sub { color: #8d8770; }
    #inventory .hint { margin: 10px 0 0; color: #8d8770; font-size: 10px; }
    /* ── the level-up (src/game/progression.js) ──────────────────────────────
       Arena hands out 3–6 attribute points a level and **asks** where they go, so this is
       a panel with one row per attribute and a number key each, not a banner. It sits
       over the pack's own corner, and it takes the keyboard until it is answered. */
    #levelup {
      position: fixed; right: 14px; top: 14px; z-index: 34; display: none;
      width: min(400px, calc(100vw - 28px)); padding: 14px 16px; box-sizing: border-box;
      background: #14110af2; border: 1px solid #6d5a1e; border-left: 3px solid #f4d98a;
      font: 12px/1.6 ui-monospace, Menlo, Consolas, monospace; color: #e8e0c8;
      box-shadow: 0 6px 24px #000a;
    }
    #levelup.on { display: block; }
    #levelup h2 { margin: 0 0 6px; font-size: 14px; color: #ffe9a8; letter-spacing: 0.04em; }
    #levelup p { margin: 4px 0; }
    #levelup ul { list-style: none; margin: 8px 0 0; padding: 0; }
    #levelup li { padding: 2px 0; border-bottom: 1px solid #241f16; }
    #levelup li.full { color: #8d8770; }
    #levelup li.spent b { color: #9fd8a8; }
    #levelup .key { color: #f4d98a; }
    #levelup b { color: #efe7d2; }
    #levelup .left { color: #ffe9a8; }
    #levelup .hint { color: #8d8770; font-size: 11px; }
    #levelup .src { color: #8d8770; font-size: 10px; }
    /* The line a pending level-up puts on the one panel (src/game/progression.js). */
    #hud .level { color: #f4d98a; }
    #hud .guard { color: #9fd8a8; }
    /* A stairway the level's own art marks (src/game/mifLevel.js): the line says where it
       goes, because in the original walking into one takes it and nothing says where. */
    #hud .stair { color: #e8c86a; }
    /* Water and lava, from `ArenaChasmUtils`'s own rules (src/scenes/interior.js). */
    #hud .water { color: #8fc4e8; }
    #hud .lava { color: #e8a06a; }
    /* ── talking to somebody (src/scenes/interior.js) ────────────────────────
       A town is for talking to people: whoever is nearest says a line of Arena's own
       prose, and the two questions the project can answer honestly are buttons. */
    #talk {
      position: fixed; right: 14px; bottom: 14px; z-index: 30; display: none; width: min(430px, calc(100vw - 28px));
      max-height: 62vh; overflow: auto; padding: 12px 15px; box-sizing: border-box;
      background: #10131cf2; border: 1px solid #4a4436; border-left: 3px solid #6f9e78;
      font: 12px/1.6 ui-monospace, Menlo, Consolas, monospace; color: #e8e0c8; box-shadow: 0 6px 24px #000a;
    }
    #talk.on { display: block; }
    #talk h2 { margin: 0 0 8px; font-size: 13px; color: #f2d9a0; letter-spacing: 0.02em; }
    #talk p.line { margin: 0 0 8px; color: #efe7d2; white-space: pre-wrap; }
    #talk p.src { margin: 0 0 10px; color: #8d8770; font-size: 10px; }
    #talk ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
    #talk button {
      font: inherit; padding: 5px 10px; background: #26304a; color: #e8e0c8;
      border: 1px solid #5d6b8e; cursor: pointer;
    }
    #talk button:hover { background: #33405f; }
    #talk .hint { margin: 9px 0 0; color: #8d8770; font-size: 10px; }
    /* ── the work somebody in the street has to offer (src/scenes/interior.js) ─
       Arena gives its side work through a person, and the prose is the offer's own —
       `artfact*.dat` where the kind has a bank, this project's words where it has not,
       with the panel saying which. */
    #talk .job { margin: 10px 0 0; padding: 8px 10px; background: #161a24; border-left: 3px solid #6f9e78; }
    #talk .job .offer { margin: 0 0 6px; color: #efe7d2; white-space: pre-wrap; }
    #talk .job .src { margin: 0 0 6px; color: #8d8770; font-size: 11px; }
    #talk .job button { color: #e8e0c8; background: #232833; border-color: #4a4436; }
    /* ── a riddle door (src/scenes/interior.js) ──────────────────────────────
       The install's quest dungeons seal doors with a sign and a riddle from their own
       `.INF`; the panel is that question, and the answer opens the door. */
    #riddle {
      position: fixed; left: 14px; bottom: 14px; z-index: 40; display: none; width: min(460px, calc(100vw - 28px));
      max-height: 62vh; overflow: auto; padding: 12px 15px; box-sizing: border-box;
      background: #10131cf2; border: 1px solid #4a4436; border-left: 3px solid #c8a54a;
      font: 12px/1.6 ui-monospace, Menlo, Consolas, monospace; color: #e8e0c8; box-shadow: 0 6px 24px #000a;
    }
    #riddle.on { display: block; }
    #riddle h2 { margin: 0 0 8px; font-size: 13px; color: #f2d9a0; letter-spacing: 0.04em; text-transform: uppercase; }
    #riddle p.line { margin: 0 0 10px; color: #efe7d2; white-space: pre-wrap; }
    #riddle form { display: flex; gap: 7px; margin: 0 0 8px; }
    #riddle input {
      flex: 1; min-width: 0; font: inherit; padding: 6px 9px; background: #0b0e15;
      color: #ffe9a8; border: 1px solid #4a4436;
    }
    #riddle input:focus { outline: 1px solid #c8a54a; }
    #riddle button {
      font: inherit; padding: 6px 12px; background: #26304a; color: #e8e0c8;
      border: 1px solid #5d6b8e; cursor: pointer;
    }
    #riddle button:hover { background: #33405f; }
    #riddle p.src { margin: 0 0 6px; color: #e8c0b4; font-size: 11px; white-space: pre-wrap; }
    #riddle .hint { margin: 8px 0 0; color: #8d8770; font-size: 10px; }
    /* ── the menu (src/scenes/interior.js) ───────────────────────────────────
       Escape opens it, Escape closes it, and the world stops while it is up — the
       game's own pause, with the character and the objective on it, the controls
       printed once so they are somewhere a player can find them, and **New Game**,
       which starts over with the same Arena folder still open. */
    #menu {
      position: fixed; inset: 0; z-index: 50; display: none; overflow: auto;
      background: #05060ad9; place-items: center;
      font: 13px/1.65 ui-monospace, Menlo, Consolas, monospace; color: #e8e0c8;
    }
    #menu.on { display: grid; }
    #menu .panel {
      width: min(560px, calc(100vw - 32px)); padding: 20px 24px 18px; box-sizing: border-box;
      background: #10131cf7; border: 1px solid #4a4436; border-left: 3px solid #c8a54a;
      box-shadow: 0 14px 60px #000c;
    }
    #menu h2 { margin: 0 0 10px; font-size: 16px; color: #f2d9a0; letter-spacing: 0.06em; text-transform: uppercase; }
    #menu .who { margin: 0 0 4px; color: #efe7d2; }
    #menu .obj { margin: 0 0 4px; color: #ffe9a8; }
    #menu .side { margin: 0 0 4px; color: #9fd8a8; }
    #menu .stat { margin: 0 0 4px; color: #c9c3ab; }
    #menu .stat b { color: #ffe9a8; }
    #menu .gold { color: #e8c86a; }
    #menu .rows { display: grid; gap: 8px; margin: 14px 0 4px; }
    #menu button {
      font: inherit; text-align: left; padding: 9px 12px; cursor: pointer;
      background: #161a24; color: #e8e0c8; border: 1px solid #3b4358; border-left: 3px solid #5d6b8e;
    }
    #menu button:hover { background: #1e2432; border-left-color: #9fd8a8; }
    #menu button.danger { border-left-color: #8c3a2e; }
    #menu button.danger:hover { background: #2a1a18; border-left-color: #e2564a; }
    #menu button .key { color: #ffe9a8; margin-right: 8px; }
    #menu button .tag { color: #8d8770; float: right; margin-left: 10px; }
    #menu .confirm { display: none; margin: 12px 0 2px; padding: 10px 12px; background: #1a1310; border-left: 3px solid #8c3a2e; }
    #menu .confirm.on { display: block; }
    #menu .confirm p { margin: 0 0 8px; color: #e8c0b4; }
    #menu .confirm .rows { margin: 0; }
    /* The controls, printed once: a player who has forgotten the keys should not have to
       leave the game to find them. Two columns so the whole list fits without scrolling. */
    #menu .controls { display: none; margin: 12px 0 0; grid-template-columns: 1fr 1fr; gap: 2px 16px; }
    #menu .controls.on { display: grid; }
    #menu .controls div { color: #c9c3ab; }
    #menu .controls .k { color: #ffe9a8; }
    /* The music slider: the soundtrack is the one thing a player may want off, and the
       level is remembered across pages (`musicPlayer.setMusicVolume`). */
    #menu .volume { display: grid; grid-template-columns: auto 1fr 4ch; gap: 10px; align-items: center; margin: 14px 0 0; color: #c9c3ab; }
    #menu .volume input { width: 100%; accent-color: #c8a54a; }
    #menu .volume output { color: #ffe9a8; text-align: right; }
    /* The 320×200 tick: Arena's own picture, on or off (game/videoSettings.js). */
    #menu .tick { display: flex; align-items: center; gap: 9px; margin: 12px 0 0; color: #c9c3ab; cursor: pointer; }
    #menu .tick input { accent-color: #c8a54a; width: 15px; height: 15px; }
    #menu .hint { margin: 12px 0 0; color: #8d8770; font-size: 11px; }
    /* ── the automap (src/scenes/automap.js) ────────────────────────────────
       Arena's own map of the level the player is standing in. The parchment,
       the voxel colours and the 3×3 arrow are OpenTESArena's table
       (src/game/automap.js); `Tab` opens it in a dungeon or a building, where
       the world map never answered "where am I". `M` stays the world map of
       Tamriel everywhere — the automap only ever had a borrowed key. */
    #automap {
      position: fixed; inset: 0; z-index: 45; display: none; place-items: center;
      background: #05060ad9;
      font: 12px/1.6 ui-monospace, Menlo, Consolas, monospace; color: #e8e0c8;
    }
    #automap.on { display: grid; }
    #automap .panel {
      width: min(760px, calc(100vw - 24px)); padding: 14px 16px 12px; box-sizing: border-box;
      background: #14110af7; border: 1px solid #6d5a1e; border-left: 3px solid #f4d98a;
      box-shadow: 0 14px 60px #000c;
    }
    #automap h2 { margin: 0 0 2px; font-size: 14px; color: #ffe9a8; letter-spacing: 0.04em; }
    #automap .sub { margin: 0 0 8px; color: #8d8770; }
    #automap canvas {
      display: block; width: 100%; height: auto; image-rendering: pixelated;
      background: #0c0a07; border: 1px solid #3b2f18;
    }
    #automap .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 8px 0 0; color: #c9c3ab; }
    #automap .legend span { display: inline-flex; align-items: center; gap: 5px; }
    #automap .legend i { display: inline-block; width: 10px; height: 10px; border: 1px solid #00000066; }
    #automap .rows { display: flex; gap: 8px; margin: 10px 0 0; }
    #automap button {
      font: inherit; text-align: left; padding: 7px 11px; cursor: pointer;
      background: #161a24; color: #e8e0c8; border: 1px solid #3b4358; border-left: 3px solid #5d6b8e;
    }
    #automap button:hover { background: #1e2432; border-left-color: #9fd8a8; }
    #automap button .key { color: #ffe9a8; margin-right: 7px; }
    #automap .hint { margin: 8px 0 0; color: #8d8770; font-size: 10px; }

    /* ══ ARENA'S WINDOWS ══════════════════════════════════════════════════════

       One law for every page — the pack, the book, the talk, the riddle, the level-up, the
       menu, the automap, the arrival card, the ending, the start screen: **a compact slab of
       night stone with the install's parchment breathed into it**, a 2 px gold rule on the
       edge it opens from, a small-caps gold heading, cream body text, muted stone-grey for
       the quiet lines, and a raised plate for a button. No panel is wider than 480 px unless
       its picture needs it, and none is taller than the window it lives in.

       The 1994 screens are a dark room with a lit page; this is the same room, the same
       parchment, read at a modern size. `arenaGui.js` still publishes the install's art as
       `--ar-parchment`, so a folder with Arena in it gets the real texture under the wash. */
    #arrival, #notice, #inventory, #levelup, #talk, #riddle,
    #menu .panel, #automap .panel, #startmenu .panel, #ending,
    #map-board, #map-card, #map-sheet {
      color: var(--ar-ink);
      font-family: var(--ar-face);
      background-color: var(--ar-page);
      background-image: linear-gradient(#0e1015f2, #0a0b0ff8), var(--ar-parchment);
      background-size: cover, 100% 100%; background-repeat: no-repeat;
      border: 1px solid var(--ar-page-edge);
      border-left: 2px solid var(--ar-gold);
      box-shadow: 0 12px 34px #000b;
      text-shadow: none;
    }
    /* A heading is a label on a stone lintel, not a banner. */
    #arrival h2, #inventory h2, #levelup h2, #talk h2, #riddle h2,
    #menu h2, #automap h2, #ending h2, #startmenu h1, #map-board h2, #map-card h2 {
      margin: 0 0 8px; color: var(--ar-gold-lit); text-shadow: none; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase; font-size: 12px; line-height: 1.3;
    }
    #startmenu h1 { font-size: 26px; letter-spacing: 0.28em; margin: 2px 0 4px; }
    #ending h2 { font-size: 22px; letter-spacing: 0.18em; margin-bottom: 14px; }
    #arrival h2 { font-size: 11.5px; }
    /* Quiet lines: one grey, everywhere. */
    #arrival .src, #talk p.src, #riddle p.src, #inventory .hint, #levelup .hint,
    #levelup .src, #talk .hint, #riddle .hint, #menu .hint, #automap .hint, #ending .hint,
    #inventory .sub, #automap .sub, #startmenu .sub, #startmenu .hint, #startmenu .kicker,
    #startmenu .folder, #map-card .sub, #map-board .sub, #map-board .hint, #ending .src {
      color: var(--ar-ink-soft); text-shadow: none;
    }
    #inventory .hint, #levelup .src, #riddle .hint, #talk .hint, #automap .hint { font-size: 10px; }
    /* A noun the eye should catch is gold; a warning is the old red, lightened for stone. */
    #inventory b, #levelup b, #ending .record b, #menu .stat b, #map-card code, #map-board code,
    #inventory .item-name { color: var(--ar-gold-lit); }
    #inventory h3 { margin: 9px 0 3px; font-size: 10px; color: var(--ar-gold); letter-spacing: 0.14em; }
    #inventory li, #levelup li { border-bottom: 1px solid #262a33; }
    #inventory li { padding: 3px 0; }
    #ending .record b, #levelup li.spent b { color: #9ee0b0; }
    #levelup li.full { color: #8c8676; }
    #menu .gold, #menu .obj, #menu .side, #levelup .left, #levelup .key,
    #automap button .key, #talk .k, #riddle .k, #menu button .key, #startmenu button .key {
      color: var(--ar-gold);
    }
    #menu .side { color: #9ee0b0; }
    #menu .confirm { background: #241a17; border-left: 2px solid #a5473a; }
    #menu .confirm p { color: #e8a897; }
    #talk .job { background: #12161d; border-left: 2px solid #4e6a86; }
    #talk p.line, #riddle p.line, #menu .who, #menu .controls div, #menu .stat,
    #automap .legend, #automap .legend span, #map-tools, #map-board li, #map-card { color: var(--ar-ink); }
    #map-board li { background: #12161d; border-left: 2px solid #4e6a86; }
    #map-board .active { background: #101b16; border-left: 2px solid #4e7a5e; }

    /* ── a button is a raised plate of the same stone ─────────────────────── */
    #inventory button, #talk button, #riddle button, #levelup button, #menu button,
    #automap button, #map-board button, #map-card button, #map-sheet button,
    #startmenu button, #chargen-panel button, #boot button {
      font: inherit; font-size: 11.5px; line-height: 1.3; padding: 5px 9px; margin: 2px 0 0;
      cursor: pointer; text-align: left; border-radius: 2px; text-shadow: none;
      background: #171b23; color: #e7dcc4;
      border: 1px solid #343b49; border-left: 2px solid #5b6a8c;
      -webkit-tap-highlight-color: transparent;
    }
    #inventory button:hover, #talk button:hover, #riddle button:hover, #levelup button:hover,
    #menu button:hover, #automap button:hover, #map-board button:hover, #map-card button:hover,
    #map-sheet button:hover, #startmenu button:hover:not(:disabled), #chargen-panel button:hover {
      background: #1f2532; border-left-color: var(--ar-gold); color: #fff3d6;
    }
    #menu button.danger, #map-sheet button.danger { border-left-color: #8c3a2e; color: #e8b0a2; }
    #menu button.danger:hover, #map-sheet button.danger:hover { background: #2a1a18; border-left-color: #e2564a; color: #ffc9bd; }
    #startmenu button:disabled { color: #6b6455; background: #101219; border-left-color: #34302a; cursor: default; }
    #startmenu button .key { margin-right: 8px; }
    #menu button .tag, #startmenu button .tag { color: var(--ar-ink-soft); float: right; margin-left: 10px; font-size: 10px; }

    /* ── the fields ──────────────────────────────────────────────────────── */
    #riddle input, #inventory input, #menu input, #chargen-panel input, #chargen-panel select {
      color: var(--ar-ink); background: #0b0d12; border: 1px solid #3a4152;
      font-family: var(--ar-face); font-size: 12px; border-radius: 2px;
    }
    #riddle input:focus, #inventory input:focus, #menu input:focus { outline: 1px solid var(--ar-gold); }
    #menu .volume input, #menu .tick input, #levelup input { accent-color: var(--ar-gold); }
    #menu .volume { color: var(--ar-ink-soft); }
    #menu .volume output { color: var(--ar-gold-lit); }

    /* ── the sizes: small on purpose ─────────────────────────────────────── */
    #arrival {
      width: min(470px, 88vw); padding: 12px 15px; box-sizing: border-box;
      font: 11.5px/1.65 var(--ar-ui); box-shadow: 0 14px 40px #000b;
    }
    #arrival p { margin: 0 0 4px; }
    #arrival .src { margin-top: 7px; font-size: 10px; }
    #notice {
      max-width: min(470px, 88vw); padding: 7px 12px; box-sizing: border-box;
      background-color: #0b1210f0;
      background-image: linear-gradient(#0b1210f0, #080c0af8), var(--ar-parchment);
      border: 1px solid #2f4a3a; border-left: 2px solid #6f9e78;
      color: #cfe8d4; font: 11.5px/1.55 var(--ar-ui); text-align: center;
      box-shadow: 0 8px 24px #000a;
    }
    #inventory {
      width: min(360px, calc(100vw - 24px)); max-height: 74vh;
      padding: 11px 13px; font: 11.5px/1.55 var(--ar-face);
    }
    #inventory.portrait-mode { padding: 12px 14px; }
    #levelup { width: min(340px, calc(100vw - 24px)); padding: 11px 13px; font: 11.5px/1.55 var(--ar-face); }
    #talk { width: min(390px, calc(100vw - 24px)); max-height: 58vh; padding: 11px 13px; font: 11.5px/1.55 var(--ar-face); }
    #talk .job { padding: 7px 9px; }
    #riddle { width: min(400px, calc(100vw - 24px)); max-height: 58vh; padding: 11px 13px; font: 11.5px/1.55 var(--ar-face); }
    #riddle h2 { letter-spacing: 0.1em; }
    #riddle form { gap: 5px; }
    #menu, #automap { background: #05060ad9; }
    #menu .panel { width: min(470px, calc(100vw - 28px)); padding: 16px 18px 14px; }
    #menu .rows, #startmenu .rows { gap: 5px; margin: 12px 0 4px; }
    #menu .controls { gap: 1px 14px; font-size: 11px; }
    #automap .panel { width: min(680px, calc(100vw - 24px)); padding: 12px 14px; }
    #automap .rows { gap: 6px; }
    #startmenu .panel { width: min(440px, calc(100vw - 28px)); padding: 18px 20px 16px; }
    #startmenu .sub { margin: 0 0 14px; font-size: 12px; }
    #map-board { width: min(320px, calc(100vw - 24px)); font-size: 11.5px; }
    #map-card { width: min(290px, calc(100vw - 24px)); font-size: 11.5px; }

    /* ── the ending is the darkest page, and the only loud one ────────────── */
    #ending {
      padding: 7vh 6vw; font: 12.5px/1.7 var(--ar-ui); text-align: center;
      background-color: #07080c;
      background-image: radial-gradient(ellipse at 50% 0%, #241a14f5, #05060afa 70%),
        var(--ar-parchment);
      background-size: cover, 100% 100%;
    }
    #ending h2 { color: #f4d98a; text-shadow: 0 0 24px #f4d98a44; }
    #ending p.quote { max-width: 64ch; margin: 0 auto 12px; color: #ece2cc; font-size: 13px; }
    #ending .record {
      max-width: 54ch; margin: 20px auto 14px; padding: 11px 15px;
      border-top: 1px solid var(--ar-rule); border-bottom: 1px solid var(--ar-rule);
      color: #cfc4aa;
    }
    #ending .record p { margin: 2px 0; }

    /* ── THE ONE STONE, AND THE INSTALL'S OWN GOLD LINTEL ───────────────────
       Every page is the same slab: `POPUP3.IMG`'s mottled rock (published as `--ar-stone`)
       under a light ink wash, its double-zigzag top and bottom bands (`--ar-band`, cut from
       the same painting) as the frame's own ornament, a 2 px gold edge, and the gold a
       1994 Arena window letters its headings in. */
    #arrival, #notice, #inventory, #levelup, #talk, #riddle,
    #menu .panel, #automap .panel, #startmenu .panel, #ending,
    #map-board, #map-card, #map-sheet {
      color: var(--ar-ink);
      background-color: var(--ar-page);
      background-image:
        var(--ar-band), var(--ar-band-bottom),
        linear-gradient(#14130ef0, #08080af6), var(--ar-stone);
      background-size: 100% 10px, 100% 8px, cover, var(--ar-stone-w) var(--ar-stone-h);
      background-position: 0 0, 0 100%, 0 0, 0 0;
      background-repeat: no-repeat, no-repeat, no-repeat, repeat;
      border: 1px solid #5f5026; border-left: 2px solid var(--ar-gold);
      border-radius: 2px;
      box-shadow: inset 0 0 0 1px #0009, inset 0 0 0 2px #c8a54a2e, 0 14px 38px #000c;
      text-shadow: none;
    }
    #inventory, #talk, #riddle, #levelup { padding-top: 17px; }
    /* The original's headings are bright gold; the small-caps kept, the flat grey dropped. */
    #arrival h2, #inventory h2, #levelup h2, #talk h2, #riddle h2,
    #menu h2, #automap h2, #ending h2, #startmenu h1, #map-board h2, #map-card h2 {
      color: #f4c94c; text-shadow: 0 1px 2px #000c;
    }
    #inventory h2, #talk h2, #riddle h2, #levelup h2, #menu h2, #automap h2,
    #map-board h2, #map-card h2, #arrival h2 {
      padding-bottom: 6px; border-bottom: 1px solid #c8a54a30;
    }
    /* A button is a raised plate of the same stone, gold-edged like POPUP3's own buttons. */
    #inventory button, #talk button, #riddle button, #levelup button, #menu button,
    #automap button, #map-board button, #map-card button, #map-sheet button,
    #startmenu button, #chargen-panel button, #boot button {
      background: linear-gradient(#1c1911, #100e0a); color: #e8d9ae;
      border: 1px solid #5f5026; border-left: 2px solid #a8873a;
      box-shadow: inset 0 1px 0 #c8a54a22;
    }
    #inventory button:hover, #talk button:hover, #riddle button:hover, #levelup button:hover,
    #menu button:hover, #automap button:hover, #map-board button:hover, #map-card button:hover,
    #map-sheet button:hover, #startmenu button:hover:not(:disabled), #chargen-panel button:hover {
      background: linear-gradient(#2c2413, #16120a); border-color: #d8b04a;
      border-left-color: #f4c94c; color: #ffe9a8;
    }
    /* The pack's summary is a plate; the pack/spells switch is a pair of tabs. */
    #inventory .stat {
      margin: 0 0 9px; padding: 6px 9px; font-size: 11px; line-height: 1.5;
      background: #00000059; border-left: 2px solid #5f5026; color: #d9cdae;
    }
    #inventory .stat b { color: #f4c94c; }
    #inventory .hint button {
      padding: 2px 8px; font-size: 10.5px; background: #12100a; min-height: 0;
      border: 1px solid #4a3f22; border-left-width: 2px;
    }
    #inventory li button { margin-left: 3px; }
    #inventory .shop-lede { color: #f0d9a0; border-left: 2px solid #a8873a; padding-left: 8px; }
    #inventory { width: min(360px, calc(100vw - 24px)); max-height: 74vh; padding: 11px 13px; }
    #levelup { width: min(340px, calc(100vw - 24px)); padding: 11px 13px; }
    #talk { width: min(390px, calc(100vw - 24px)); max-height: 58vh; padding: 11px 13px; }
    #riddle { width: min(400px, calc(100vw - 24px)); max-height: 58vh; padding: 11px 13px; }
    #menu .panel { width: min(470px, calc(100vw - 28px)); padding: 16px 18px 14px; }
    #automap .panel { width: min(680px, calc(100vw - 24px)); padding: 12px 14px; }
    #startmenu .panel { width: min(440px, calc(100vw - 28px)); padding: 18px 20px 16px; }
    /* Scrollbars are part of the frame: a thin gold-lit groove, never a white OS bar. */
    #hud, #inventory, #talk, #riddle, #levelup, #menu .panel, #automap .panel,
    #map-board, #map-card, #map-sheet, #chargen-panel, #menu {
      scrollbar-width: thin; scrollbar-color: #4a3f22 #0a0906;
    }
    #hud::-webkit-scrollbar, #inventory::-webkit-scrollbar, #talk::-webkit-scrollbar,
    #riddle::-webkit-scrollbar, #levelup::-webkit-scrollbar, #menu .panel::-webkit-scrollbar,
    #automap .panel::-webkit-scrollbar, #map-board::-webkit-scrollbar,
    #map-card::-webkit-scrollbar, #map-sheet::-webkit-scrollbar { width: 8px; height: 8px; }
    #hud::-webkit-scrollbar-track, #inventory::-webkit-scrollbar-track, #talk::-webkit-scrollbar-track,
    #riddle::-webkit-scrollbar-track, #levelup::-webkit-scrollbar-track,
    #menu .panel::-webkit-scrollbar-track, #automap .panel::-webkit-scrollbar-track,
    #map-board::-webkit-scrollbar-track, #map-card::-webkit-scrollbar-track,
    #map-sheet::-webkit-scrollbar-track { background: #0a0906; }
    #hud::-webkit-scrollbar-thumb, #inventory::-webkit-scrollbar-thumb, #talk::-webkit-scrollbar-thumb,
    #riddle::-webkit-scrollbar-thumb, #levelup::-webkit-scrollbar-thumb,
    #menu .panel::-webkit-scrollbar-thumb, #automap .panel::-webkit-scrollbar-thumb,
    #map-board::-webkit-scrollbar-thumb, #map-card::-webkit-scrollbar-thumb,
    #map-sheet::-webkit-scrollbar-thumb { background: #4a3f22; border-radius: 4px; }
    /* Character creation and the map screens wear the same stone as everything else. */
    #chargen { background: #050505; color: var(--ar-ink); font-family: var(--ar-face); }
    #chargen-panel {
      background-color: #0b0b08;
      background-image: linear-gradient(#14130ef5, #08080afa), var(--ar-stone);
      background-size: cover, var(--ar-stone-w) var(--ar-stone-h);
      box-shadow: inset 0 0 0 1px #0008, inset 0 0 0 3px #c8a54a1f;
    }
    #chargen-panel h1 { color: #f4c94c; }
    #chargen-panel .lead, #chargen-panel .field { color: var(--ar-ink); }
    #chargen-panel .sub, #chargen-panel .look-note, #chargen-panel .look-choice .tag,
    #chargen-panel .look-swatch .name { color: var(--ar-ink-soft); }
    #chargen-panel .steps { color: #c8a54a; }
    #chargen-panel .steps b { color: #f4c94c; }
    #map-tools, #map-bar, #map-journal, #map-legend, #map-sheet, #map-board, #map-card {
      background-color: #0b0b08;
      background-image: linear-gradient(#14130ef2, #08080af8), var(--ar-stone);
      background-size: cover, var(--ar-stone-w) var(--ar-stone-h);
      background-repeat: repeat;
      border: 1px solid #5f5026; color: var(--ar-ink); font-family: var(--ar-face);
      box-shadow: inset 0 0 0 1px #0008, 0 8px 24px #000a;
    }
    #map-bar .obj, #map-bar .pieces, #map-sheet b, #map-readout, #map-hover,
    #map-legend b, #map-journal b { color: #f4c94c; }
    #map-bar .side, #map-board .src { color: #9ee0b0; }
    #map-tools small, #map-legend .d, #map-bar .hint, #map-journal { color: var(--ar-ink-soft); }
    #map-tools select, #map-search, #map-tools button, #map-bar button,
    #map-sheet select, #map-sheet input {
      background: #14110b; color: var(--ar-ink); border: 1px solid #5f5026;
      font-family: var(--ar-face);
    }

    /* ── A PHONE IS A WINDOW TOO ────────────────────────────────────────────
       The touch layer is `engine/ui/touchControls.js`; this is the layout it lives in. The
       vitals sit in the top-left, the hotbar on the bottom edge, and the thumbs' own controls
       between them; no rule here is behind a JavaScript switch — a narrow window gets the
       narrow layout whether it is a phone or a slim desktop window. */
    @media (max-width: 900px) {
      /* Safe areas: an iPhone's notch, its rounded corners and the home indicator are the
         window's frame, not the page's. Every fixed edge here steps inside them. */
      #statusbar {
        left: calc(8px + env(safe-area-inset-left, 0px));
        top: calc(8px + env(safe-area-inset-top, 0px));
        bottom: auto; width: 160px;
        gap: 5px; padding: 7px 8px 6px;
      }
      #statusbar #hud-quest {
        display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
        overflow: hidden; font-size: 10px; line-height: 1.35; padding-top: 5px;
      }
      #statusbar .sb-purse { gap: 6px; padding-top: 5px; }
      #statusbar .sb-purse #sb-level { display: none; }
      #hotbar {
        bottom: calc(6px + env(safe-area-inset-bottom, 0px));
        gap: 2px; padding: 4px 5px;
      }
      #hotbar .hb-cell { width: calc((100vw - 38px) / 10); max-width: 40px; height: 38px; }
      #hotbar .hb-cell .hb-label { display: none; }
      #hud {
        left: calc(8px + env(safe-area-inset-left, 0px));
        right: calc(8px + env(safe-area-inset-right, 0px));
        top: calc(168px + env(safe-area-inset-top, 0px)); width: auto;
        max-height: 18vh; font-size: 11px; pointer-events: auto;
      }
      #hud .hint, #hud #hud-place .hint { display: none; }
      #compass { display: none; }
      #inventory, #talk, #riddle, #levelup {
        left: calc(6px + env(safe-area-inset-left, 0px));
        right: calc(6px + env(safe-area-inset-right, 0px));
        width: auto; top: auto;
        bottom: calc(58px + env(safe-area-inset-bottom, 0px)); max-height: 52vh;
      }
      #menu .panel, #automap .panel { width: calc(100vw - 18px); padding: 12px 12px 11px; }
      #inventory button, #talk button, #riddle button, #levelup button,
      #menu button, #automap button, #startmenu button { min-height: 34px; }
    }
    @media (max-width: 620px) {
      #hud { max-height: 16vh; }
      #statusbar .sb-health span, #statusbar .sb-stamina span, #statusbar .sb-spell span { font-size: 7.5px; letter-spacing: 0.1em; }
      #statusbar .sb-purse .sb-keys { display: none; }
      #arrival { width: 92vw; padding: 10px 12px; }
      #ending { padding: 6vh 5vw; }
      #ending h2 { font-size: 18px; }
      #riddle form { flex-wrap: wrap; }
      #riddle input { flex: 1 1 100%; }
    }
    @media (hover: none) and (pointer: coarse) {
      /* A finger needs a bigger plate than a pointer does. */
      #inventory button, #talk button, #riddle button, #levelup button,
      #menu button, #automap button, #startmenu button { min-height: 38px; }
      #hotbar .hb-cell .hb-key { font-size: 9px; }
      #hud { font-size: 11.5px; }
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <canvas id="weapon"></canvas>
  <!-- The three vitals, Daggerfall-style: health, stamina and magicka in the bottom-left
       corner, with the quest marker, the purse and the level on the same plate.
       `renderStatusBar` in `scenes/interior.js` writes the figures and the fills. -->
  <div id="statusbar" aria-hidden="true">
    <div class="sb-health"><span>health</span><b id="sb-health">—</b><i id="sb-health-bar"></i></div>
    <div class="sb-stamina"><span>stamina</span><b id="sb-stamina">—</b><i id="sb-stamina-bar"></i></div>
    <div class="sb-spell"><span>magicka</span><b id="sb-spell">—</b><i id="sb-spell-bar"></i></div>
    <div id="hud-quest"></div>
    <div class="sb-purse"><span class="coin"></span><span><b id="sb-gold">0</b> gold</span><span id="sb-level">level 1</span><span class="sb-keys" id="sb-hotbar-hint"></span></div>
  </div>
  <!-- The hotbar's ten cells are built by `renderHotbar` from `game/hotbar.js`, on the
       command strip's own buttons (`S2.IMG`). -->
  <div id="hotbar" role="toolbar" aria-label="hotbar"></div>
  <div id="hud">
    <button id="hud-toggle" type="button" class="hud-toggle" title="Hide the messages" aria-expanded="true">−</button>
    <div id="hud-place"></div><div id="hud-fight"></div><div id="hud-here"></div>
  </div>
  <div id="compass" aria-hidden="true"><span id="compass-points"></span><b id="compass-face">E 90°</b></div>
  <div id="arrival"></div>
  <div id="notice"></div>
  <div id="inventory"></div>
  <div id="levelup"></div>
  <div id="talk"></div>
  <div id="riddle"></div>
  <div id="ending"></div>
  <div id="cutscene"></div>
  <div id="menu"></div>
  <div id="automap">
    <div class="panel">
      <h2 id="automap-title">this level</h2>
      <p class="sub" id="automap-sub"></p>
      <canvas id="automap-canvas" width="720" height="480"></canvas>
      <div class="legend" id="automap-legend"></div>
      <div class="rows">
        <button type="button" data-automap="worldmap"><span class="key">M</span>the world map of Tamriel</button>
        <button type="button" data-automap="close"><span class="key">Tab</span>close this map</button>
      </div>
      <p class="hint">Tab or Esc puts this map away. M is Tamriel from anywhere. The arrow is where you stand and which way you face.</p>
    </div>
  </div>
  <div id="chargen"></div>
  <div id="boot">PERFECTARENA<br />starting…</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
